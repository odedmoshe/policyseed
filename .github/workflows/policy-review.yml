# Example GitHub Action for repos that keep their policies under version control with
# policyseed. Copy this file into your own repo's .github/workflows/ and adjust paths
# if your intake.yaml or policies/ directory live somewhere else.
#
# It fails the workflow when any policy's last review date has exceeded its
# review_cadence (see `policyseed --help` and docs/github-action.md), so an overdue
# policy shows up as a red check on your default branch and in your weekly run history.
name: Policy review check

on:
  push:
    branches: [main]
    paths:
      - "intake.yaml"
      - "policies/**"
  schedule:
    # Every Monday at 09:00 UTC. Adjust to taste — this only needs to run often enough
    # that an overdue policy gets noticed within a reasonable window.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

jobs:
  check:
    # Skip in the template repository itself, which has no intake.yaml. Harmless in your own repo.
    if: github.repository != 'odedmoshe/policyseed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs `policyseed check` from the action's own checkout (no npm install, no network
      # fetch of the package) and writes the result to the job summary. Pin to @v1 for
      # compatible updates, or to a full commit SHA for a fully reproducible run.
      - name: Run policyseed check
        uses: odedmoshe/policyseed@v1
        with:
          command: check
          intake: intake.yaml
          policies-dir: policies
